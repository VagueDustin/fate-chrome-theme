name: release

# Tag a version and the themes build themselves:
#   git tag v1.0.0 && git push origin v1.0.0
# The zips land on the Releases page, which is the download link you hand out.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The manifest version has to match the tag, or the Web Store rejects a
      # re-upload as "version already exists". On a manual dispatch there is no
      # tag, so the build just falls back to the default version.
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node build.mjs --version="${GITHUB_REF_NAME#v}"
          else
            node build.mjs
          fi
          node pack.mjs
          ls -la dist/*.zip

      # Dispatch runs stop here and serve as a build check.
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "FATE themes $GITHUB_REF_NAME" \
            --generate-notes
